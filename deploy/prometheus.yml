global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "muraqib-telemetry"
    metrics_path: /metrics
    static_configs:
      - targets: ["muraqib:8000"]
        labels:
          service: "muraqib-telemetry"
          environment: "production"
